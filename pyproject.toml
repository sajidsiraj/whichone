[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whichone"
version = "0.1.0"
description = "Two-stage MODM+MADM decision support for selecting LLMs in agentic AI systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Sajid Siraj" },
  { name = "Maria Barbati" },
]
dependencies = [
  "pydantic>=2.5",
  "numpy>=1.26",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]
pro = [
  "psycopg[binary,pool]>=3.1",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "psycopg[binary,pool]>=3.1",
]

[tool.setuptools.packages.find]
include = ["whichone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
